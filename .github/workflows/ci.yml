name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: find scripts skills -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: git diff --check
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/check-generated.sh
      - run: bash scripts/everyharness.sh validate
      - run: bash scripts/everyharness.sh bump --check
